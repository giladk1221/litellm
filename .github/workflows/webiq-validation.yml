name: WebIQ focused validation
on:
  push:
    branches: [webiq-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      BASE_REF: "7210403e2334504872f2c46220d9a0fd36eab622"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feat-webiq-search
          fetch-depth: 10
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"
      - name: Identify tested revision
        run: git rev-parse HEAD
      - name: Install locked dependencies
        run: uv sync --frozen --extra proxy --group proxy-dev
      - name: Provider tests
        run: uv run --no-sync pytest tests/unit/llms/webiq/search -v --cov=litellm.llms.webiq --cov-report=term-missing
      - name: Existing search interception regressions
        run: uv run --no-sync pytest tests/test_litellm/integrations/websearch_interception -q --maxfail=3
      - name: Targeted mutation checks
        run: |
          uv run --no-sync python - <<'PYTHON'
          from pathlib import Path
          import subprocess
          provider = Path("litellm/llms/webiq/search/transformation.py")
          registry = Path("litellm/utils.py")
          cases = (
              (provider, '"x-apikey": resolved_key', '"x-wrong-key": resolved_key', "test_search_maps_request_and_preserves_sources"),
              (provider, '"maxResults": optional_params.get("max_results")', '"maxResults": None', "test_search_maps_request_and_preserves_sources"),
              (provider, "snippet=result.content", "snippet=result.title", "test_search_maps_request_and_preserves_sources"),
              (registry, "SearchProviders.WEBIQ: WebIQSearchConfig,", "", "test_search_maps_request_and_preserves_sources"),
          )
          for path, original_text, replacement, test in cases:
              source = path.read_text()
              assert source.count(original_text) == 1
              try:
                  path.write_text(source.replace(original_text, replacement))
                  result = subprocess.run(["uv", "run", "--no-sync", "pytest", f"tests/unit/llms/webiq/search/test_transformation.py::{test}", "-q", "--tb=short"], check=False)
                  assert result.returncode == 1, f"Mutation not killed: {original_text} ({result.returncode})"
                  print(f"Killed mutation: {original_text}", flush=True)
              finally:
                  path.write_text(source)
          subprocess.run(["uv", "run", "--no-sync", "pytest", "tests/unit/llms/webiq/search", "-q"], check=True)
          PYTHON
      - name: Provider catalog and focused lint
        run: |
          uv run --no-sync python tests/code_coverage_tests/check_provider_folders_documented.py
          uv run --no-sync ruff check --config ruff-strict.toml litellm/llms/webiq
          uv run --no-sync ruff check --config ruff-tests.toml tests/unit/llms/webiq
          uv run --no-sync ruff format --check litellm/llms/webiq tests/unit/llms/webiq
          git diff --exit-code
