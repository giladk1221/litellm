name: Copilot document regression QA
on:
  push:
    branches: [qa_copilot_text_documents_20261122]
permissions:
  contents: read
  actions: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"
      - name: Restore the upstream main native runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45005154930 --repo BerriAI/litellm --name rust-bridge-45005154930-1 --dir .qa-runtime
          cp .qa-runtime/litellm/rust_bridge/_native.abi3.so litellm/rust_bridge/_native.abi3.so
      - name: Install locked test dependencies
        run: uv sync --frozen --no-install-project --extra proxy --group dev
      - name: Prove the regression fails before the fix
        run: |
          mkdir -p qa-results
          cp litellm/llms/github_copilot/messages/transformation.py qa-results/patched.py
          git show 6df435f81c1703f1c6c61a2b4f4f1aaf54a31c0c:litellm/llms/github_copilot/messages/transformation.py > litellm/llms/github_copilot/messages/transformation.py
          set +e
          uv run --no-sync pytest tests/unit/llms/github_copilot/messages/test_github_copilot_messages_transformation.py -k 'text_attachment or plain_document or text_document_fallback' -q > qa-results/before.txt 2>&1
          result=$?
          set -e
          cp qa-results/patched.py litellm/llms/github_copilot/messages/transformation.py
          cat qa-results/before.txt
          test "$result" = 1
      - name: Verify the patch and related provider behavior
        run: |
          uv run --no-sync pytest tests/unit/llms/github_copilot tests/unit/llms/anthropic/messages/native/test_anthropic_messages_transformation.py tests/unit/test_assert_ci_coverage.py -q --junitxml=qa-results/after.xml 2>&1 | tee qa-results/after.txt
      - name: Check changed files
        if: always()
        run: |
          uv run --no-sync ruff check litellm/llms/github_copilot/messages/transformation.py tests/unit/llms/github_copilot/messages/test_github_copilot_messages_transformation.py 2>&1 | tee qa-results/ruff.txt
          uv run --no-sync ruff format --check --diff litellm/llms/github_copilot/messages/transformation.py tests/unit/llms/github_copilot/messages/test_github_copilot_messages_transformation.py 2>&1 | tee qa-results/format.txt
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        if: always()
        with:
          name: copilot-document-test-results
          path: qa-results/
