model_list: []
search_tools:
  - search_tool_name: webiq-search
    litellm_params:
      search_provider: webiq
      api_key: os.environ/WEBIQ_API_KEY
  - search_tool_name: webiq-http-blocked
    litellm_params:
      search_provider: webiq
      api_key: qa-not-a-real-key
      api_base: http://api.microsoft.ai/v3
router_settings:
  redis_host: webiq-refresh-redis
  redis_port: 6379
  num_retries: 0
general_settings:
  database_url: os.environ/DATABASE_URL
  master_key: os.environ/LITELLM_MASTER_KEY
  coordination_redis:
    host: webiq-refresh-redis
    port: 6379
