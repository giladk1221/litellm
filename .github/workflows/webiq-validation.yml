name: WebIQ focused validation
on:
  push:
    branches: [webiq-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      COVERAGE_CORE: sysmon
      BASE_REF: "7210403e2334504872f2c46220d9a0fd36eab622"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feat-webiq-search
          fetch-depth: 10
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"
      - name: Identify tested revision
        run: git rev-parse HEAD
      - name: Install locked dependencies
        run: uv sync --frozen --extra proxy --group proxy-dev --group ci
      - name: Reproduce socket-policy failures then restore fix
        run: |
          uv run --no-sync python - <<'PYTHON'
          from pathlib import Path
          import subprocess
          path = Path("tests/unit/conftest.py")
          source = path.read_text()
          fixed = 'LOOPBACK_HOSTS: Final = ["127.0.0.1", "::1", "localhost"]'
          broken = 'LOOPBACK_HOSTS: Final = ["127.0.0.1", "::1"]'
          assert source.count(fixed) == 1
          try:
              path.write_text(source.replace(fixed, broken))
              regression = subprocess.run(["uv", "run", "--no-sync", "pytest", "tests/unit/test_socket_policy.py", "-q", "--tb=short"], capture_output=True, text=True)
              print(regression.stdout, regression.stderr, flush=True)
              assert regression.returncode == 1
              assert "SocketConnectBlockedError" in regression.stdout + regression.stderr
              assert "1 failed, 2 passed" in regression.stdout
              parallel = subprocess.run(["uv", "run", "--no-sync", "pytest", "tests/unit/llms/webiq", "-n", "2", "--dist=loadscope", "-q", "--tb=short"], capture_output=True, text=True)
              print(parallel.stdout, parallel.stderr, flush=True)
              assert parallel.returncode == 3
              assert "SocketConnectBlockedError" in parallel.stdout + parallel.stderr
              assert 'host "localhost"' in parallel.stdout + parallel.stderr
          finally:
              path.write_text(source)
          PYTHON
      - name: Run provider and socket-policy tests with two workers
        run: |
          uv run --no-sync pytest tests/unit/llms/webiq tests/unit/test_socket_policy.py -n 2 --dist=loadscope -v --reruns 0 --timeout=60 --cov=litellm/llms/webiq --cov-report=term-missing --junitxml=webiq-parallel.xml
          uv run --no-sync python - <<'PYTHON'
          import xml.etree.ElementTree as ET
          suite = ET.parse("webiq-parallel.xml").getroot().find("testsuite")
          assert suite is not None
          assert int(suite.attrib["tests"]) == 30, suite.attrib
          assert all(int(suite.attrib[name]) == 0 for name in ("failures", "errors", "skipped")), suite.attrib
          print("Verified 30 executed tests, no skips, failures, or errors")
          PYTHON
      - name: Workflow startup safety
        run: uv run --no-sync python tests/code_coverage_tests/check_workflow_startup_safety.py
      - name: Provider catalog and focused lint
        run: |
          uv run --no-sync python tests/code_coverage_tests/check_provider_folders_documented.py
          uv run --no-sync ruff check --config ruff-strict.toml litellm/llms/webiq
          uv run --no-sync ruff check --config ruff-tests.toml tests/unit/llms/webiq tests/unit/conftest.py tests/unit/test_socket_policy.py
          uv run --no-sync ruff format --check litellm/llms/webiq tests/unit/llms/webiq
          git diff --exit-code
      - name: Benchmark catalog setup regression
        run: |
          uv run --no-sync python - <<'PYTHON'
          import os
          import subprocess
          command = ["uv", "run", "--no-sync", "pytest", "--import-mode=importlib", "-p", "pytest_codspeed.plugin", "tests/benchmarks/", "--codspeed", "--collect-only", "-q"]
          unfixed = {key: value for key, value in os.environ.items() if key != "LITELLM_LOCAL_MODEL_COST_MAP"}
          unfixed["PYTEST_DISABLE_PLUGIN_AUTOLOAD"] = "1"
          rejected = subprocess.run(command, env=unfixed, capture_output=True, text=True)
          print(rejected.stdout, rejected.stderr, flush=True)
          assert rejected.returncode == 4
          assert "Set LITELLM_LOCAL_MODEL_COST_MAP=True" in rejected.stdout + rejected.stderr
          fixed = dict(unfixed, LITELLM_LOCAL_MODEL_COST_MAP="True")
          accepted = subprocess.run(command, env=fixed, capture_output=True, text=True)
          print(accepted.stdout, accepted.stderr, flush=True)
          assert accepted.returncode == 0
          assert "31 tests collected" in accepted.stdout
          print("Verified benchmark setup rejects an unpinned catalog and collects all 31 benchmarks with the bundled catalog")
          PYTHON
      - name: Repository checks
        run: make check
